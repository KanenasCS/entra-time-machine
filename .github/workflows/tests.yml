name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Offline test suite
        run: python synthetic/run_all.py
      - name: Console scripts
        run: |
          itm --help
          itm-collect --help
          itm-shapes --help
